<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Beatbox2MIDI</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0a0a0a;
      --surface: #151515;
      --surface-2: #1f1f1f;
      --border: #2a2a2a;
      --text: #f5f5f5;
      --text-dim: #888;
      --accent: #00e5a0;
      --accent-dim: #007a55;
      --danger: #ff3b5c;
      --warning: #ffb020;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
    }

    header {
      padding: 1.5rem 1.25rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    h1 span { color: var(--accent); }

    main {
      flex: 1;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .screen { display: none; flex-direction: column; gap: 1rem; flex: 1; }
    .screen.active { display: flex; }

    nav {
      display: flex;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.5rem;
      gap: 0.25rem;
    }

    nav button {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 0.75rem 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.15s;
    }

    nav button.active {
      background: var(--surface-2);
      color: var(--accent);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .card h2 {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }

    button.primary {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: all 0.15s;
    }

    button.primary:active { transform: scale(0.98); }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

    button.secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.75rem;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    button.danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .status {
      font-size: 0.85rem;
      color: var(--text-dim);
      text-align: center;
      padding: 0.5rem;
    }

    .visualizer {
      height: 120px;
      background: var(--surface-2);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    #visualizerCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .onset-flash {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--accent);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .onset-flash.active { opacity: 0.15; }

    .class-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .class-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .class-card.recording {
      border-color: var(--accent);
      background: rgba(0, 229, 160, 0.1);
    }

    .class-name { font-weight: 600; margin-bottom: 0.25rem; }
    .class-count { font-size: 0.8rem; color: var(--text-dim); }

    .log {
      background: var(--surface-2);
      border-radius: 8px;
      padding: 0.75rem;
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
      height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>Beatbox<span>2</span>MIDI</h1>
  </header>

  <main>
    <!-- TRAIN SCREEN -->
    <section id="screen-train" class="screen active">
      <div class="card">
        <h2>1. Active le micro</h2>
        <button id="btnMicStart" class="primary">Autoriser le micro</button>
        <p class="status" id="micStatus">Micro inactif</p>
      </div>

      <div class="card">
        <h2>2. Visualisation live</h2>
        <div class="visualizer">
          <canvas id="visualizerCanvas"></canvas>
          <div class="onset-flash" id="onsetFlash"></div>
        </div>
        <p class="status">Fais un son : tu dois voir un flash vert à chaque attaque</p>
      </div>

      <div class="card">
        <h2>3. Logs</h2>
        <div class="log" id="log">En attente...</div>
      </div>
    </section>

    <!-- JAM SCREEN -->
    <section id="screen-jam" class="screen">
      <div class="card">
        <h2>Jam mode</h2>
        <p class="status">À venir en phase 2</p>
      </div>
    </section>

    <!-- EXPORT SCREEN -->
    <section id="screen-export" class="screen">
      <div class="card">
        <h2>Export MIDI</h2>
        <p class="status">À venir en phase 3</p>
      </div>
    </section>
  </main>

  <nav>
    <button class="active" data-screen="train">Train</button>
    <button data-screen="jam">Jam</button>
    <button data-screen="export">Export</button>
  </nav>

  <script type="module" src="./src/ui.js"></script>
</body>
</html>
